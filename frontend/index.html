<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Prediction Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 50px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }

        .prediction-box,
        .history-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            margin-top: 25px;
            padding: 13px 28px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eff6ff;
            border-radius: 10px;
            border-left: 5px solid #2563eb;
        }

        .result p {
            color: #4b5563;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        .empty {
            padding: 25px;
            color: #6b7280;
            text-align: center;
        }

        @media (max-width: 768px) {
            .dashboard-cards,
            .input-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 20px;
            }

            .container {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Sales Prediction Dashboard</h1>
    <p>Machine Learning based advertising sales prediction</p>
</header>

<div class="container">

    <!-- Dashboard Cards -->
    <div class="dashboard-cards">

        <div class="card">
            <div class="card-title">TV Advertising</div>
            <div class="card-value" id="tvCard">0</div>
        </div>

        <div class="card">
            <div class="card-title">Radio Advertising</div>
            <div class="card-value" id="radioCard">0</div>
        </div>

        <div class="card">
            <div class="card-title">Newspaper Advertising</div>
            <div class="card-value" id="newspaperCard">0</div>
        </div>

    </div>

    <!-- Prediction Section -->
    <div class="prediction-box">

        <h2>Predict Sales</h2>

        <div class="input-grid">

            <div>
                <label for="tv">TV Advertising</label>
                <input
                    type="number"
                    id="tv"
                    placeholder="Enter TV spending"
                    min="0"
                    step="any"
                >
            </div>

            <div>
                <label for="radio">Radio Advertising</label>
                <input
                    type="number"
                    id="radio"
                    placeholder="Enter Radio spending"
                    min="0"
                    step="any"
                >
            </div>

            <div>
                <label for="newspaper">Newspaper Advertising</label>
                <input
                    type="number"
                    id="newspaper"
                    placeholder="Enter Newspaper spending"
                    min="0"
                    step="any"
                >
            </div>

        </div>

        <button id="predictButton" onclick="predictSales()">
            Predict Sales
        </button>

        <div class="result" id="resultBox">
            <p>Predicted Sales</p>
            <div class="result-value" id="predictionValue">0.00</div>
        </div>

        <div class="message" id="message"></div>

    </div>

    <!-- History -->
    <div class="history-box">

        <h2>Prediction History</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>TV</th>
                        <th>Radio</th>
                        <th>Newspaper</th>
                        <th>Predicted Sales</th>
                    </tr>
                </thead>

                <tbody id="historyTable">
                    <tr>
                        <td colspan="5" class="empty">
                            Loading history...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

    const API_URL = "http://localhost:8080";

    async function predictSales() {

        const tv = document.getElementById("tv").value;
        const radio = document.getElementById("radio").value;
        const newspaper = document.getElementById("newspaper").value;

        const message = document.getElementById("message");
        const resultBox = document.getElementById("resultBox");
        const predictionValue = document.getElementById("predictionValue");
        const button = document.getElementById("predictButton");

        if (tv === "" || radio === "" || newspaper === "") {
            message.style.color = "#dc2626";
            message.textContent = "Please enter all advertising values.";
            return;
        }

        button.disabled = true;
        button.textContent = "Predicting...";
        message.textContent = "";

        try {

            const response = await fetch(`${API_URL}/predict`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    tv: Number(tv),
                    radio: Number(radio),
                    newspaper: Number(newspaper)
                })
            });

            if (!response.ok) {
                throw new Error("Prediction request failed");
            }

            const data = await response.json();

            const prediction = Number(data.predicted_sales);

            predictionValue.textContent = prediction.toFixed(2);

            resultBox.style.display = "block";

            document.getElementById("tvCard").textContent = Number(tv).toFixed(2);
            document.getElementById("radioCard").textContent = Number(radio).toFixed(2);
            document.getElementById("newspaperCard").textContent = Number(newspaper).toFixed(2);

            message.style.color = "#16a34a";
            message.textContent = "Prediction completed successfully.";

            loadHistory();

        } catch (error) {

            message.style.color = "#dc2626";
            message.textContent =
                "Unable to connect to the backend. Make sure Spring Boot is running.";

            console.error(error);

        } finally {

            button.disabled = false;
            button.textContent = "Predict Sales";

        }
    }


    async function loadHistory() {

        const table = document.getElementById("historyTable");

        try {

            const response = await fetch(`${API_URL}/predictions`);

            if (!response.ok) {
                throw new Error("History request failed");
            }

            const data = await response.json();

            if (data.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty">
                            No predictions available.
                        </td>
                    </tr>
                `;

                return;
            }

            table.innerHTML = "";

            data.forEach(prediction => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${prediction.id}</td>
                    <td>${Number(prediction.tv).toFixed(2)}</td>
                    <td>${Number(prediction.radio).toFixed(2)}</td>
                    <td>${Number(prediction.newspaper).toFixed(2)}</td>
                    <td>${Number(prediction.predictedSales).toFixed(2)}</td>
                `;

                table.appendChild(row);

            });

        } catch (error) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        Unable to load prediction history.
                    </td>
                </tr>
            `;

            console.error(error);
        }
    }


    window.addEventListener("load", loadHistory);

</script>

</body>
</html>
